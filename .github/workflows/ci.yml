# MacEMUI CI: `swift test -c release --parallel` (on the macos-26 leg with the snapshot tests compared and new or changed
# pictures attached to the PR), the Claude desktop extension's Node tests and pack, a scan for private references, the shared lint job and, on a tag, the
# CHANGELOG version check.
#
# Two toolchains, each Xcode pinned (the second off on ordinary PRs, see the matrix). `macos-26` with Xcode 26.6 (Swift 6.3) is what the apps' CI builds MacEMUI with, so it
# must stay green there; `xcode-27` (macOS 27, Xcode 27.1, GitHub's preview image; not its 27.2 release candidate) is the
# toolchain the package is written for. The package deploys to macOS 26 (Package.swift: `.macOS(.v26)`).
# ShellMetalTests skip when the runner has no Metal device. `swift build` with Xcode 26.6 copies Colormaps.metal into the
# bundle uncompiled; MetalEngine then compiles it from source (issue #16).
# Never `swift build --build-tests -c release` (fails on this toolchain's Swift Build backend).
name: CI

on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Read-only by default; only the snapshots job writes (the pr-pictures branch and its comment).
permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.runner }}, Xcode ${{ matrix.xcode }})
    strategy:
      fail-fast: false
      # The xcode-27 leg runs on main, on tags, on release-please's Release PR and by hand, never on other PRs: GitHub's preview
      # image queues behind the org's five macOS runners, and the leg is not a required check (Paul, 2026-11-23). An ordinary PR
      # gets the macos-26 leg only; a break on Xcode 27.1 shows on main after the merge and on the Release PR before a release.
      # `mac`: the org's Mac (macOS 27, Xcode 27.1) while the org variable MACEM_MAC_RUNNER is set; never for a fork PR.
      matrix:
        # The snapshot references are drawn on the macos-26 leg (`snapshots`, Tests/ShellSnapshotTests); the other leg skips them.
        include: ${{ fromJSON((github.event_name != 'pull_request' || startsWith(github.head_ref, 'release-please--')) && '[{"runner":"macos-26","xcode":"26.6","snapshots":true},{"runner":"xcode-27","xcode":"27.1","mac":true}]' || '[{"runner":"macos-26","xcode":"26.6","snapshots":true}]') }}
    permissions:
      contents: read         # the tests write nothing; the snapshots job below attaches their pictures
    runs-on: ${{ matrix.mac && vars.MACEM_MAC_RUNNER && !github.event.pull_request.head.repo.fork && fromJSON(vars.MACEM_MAC_RUNNER) || matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Select Xcode ${{ matrix.xcode }}
        run: |
          if [ "$RUNNER_ENVIRONMENT" = self-hosted ]; then
            # The Mac runner: its own Xcode.app, chosen per job, never by xcode-select on that Mac.
            export DEVELOPER_DIR=/Applications/Xcode.app/Contents/Developer
            echo "DEVELOPER_DIR=$DEVELOPER_DIR" >> "$GITHUB_ENV"
            xcodebuild -version | grep -q "^Xcode ${{ matrix.xcode }}$" \
              || echo "::warning::The Mac's Xcode.app is not Xcode ${{ matrix.xcode }}; this leg ran on $(xcodebuild -version | head -1)."
          else
            sudo xcode-select -s /Applications/Xcode_${{ matrix.xcode }}.app
          fi
          sw_vers
          xcodebuild -version
          swift --version
      - name: Ensure the Metal toolchain component
        run: |
          if ! xcrun -sdk macosx metal --version >/dev/null 2>&1; then
            if [ "$RUNNER_ENVIRONMENT" = self-hosted ]; then
              # No sudo on the Mac runner. The component is installed system-wide by the runner's setup, but Xcode 27
              # also wants it registered for the CI user, which an unprivileged download request does.
              xcodebuild -downloadComponent MetalToolchain || true
              xcrun -sdk macosx metal --version || {
                xcodebuild -showComponent MetalToolchain || true
                echo "::error::No Metal toolchain for $(xcodebuild -version | head -1) on the Mac runner."; exit 1
              }
            else
              sudo xcodebuild -downloadComponent MetalToolchain
            fi
          fi
          xcrun -sdk macosx metal --version
      - name: swift test -c release --parallel
        env:
          SNAPSHOTS: ${{ matrix.snapshots && '1' || '' }}
          SNAPSHOT_ARTIFACTS: ${{ runner.temp }}/snapshots
        run: swift test -c release --parallel
      # New and changed snapshot pictures leave this read-only job as an artifact; the snapshots job attaches them (suite#137).
      - name: Keep new and changed snapshots for the snapshots job
        if: always() && matrix.snapshots && github.event_name == 'pull_request' && !github.event.pull_request.head.repo.fork
        uses: actions/upload-artifact@v7
        with:
          name: snapshots
          path: ${{ runner.temp }}/snapshots
          if-no-files-found: ignore
          retention-days: 3

  # The only job with write access: it puts the test job's new and changed snapshot pictures on the pr-pictures branch and
  # into one comment on the PR. Never on a fork's PR; it runs main's publish.sh (the base commit), not the PR's, on Linux.
  snapshots:
    name: Attach new and changed snapshots to the PR
    needs: test
    if: always() && github.event_name == 'pull_request' && !github.event.pull_request.head.repo.fork && needs.test.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write        # the pr-pictures branch
      pull-requests: write   # the snapshots comment
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          sparse-checkout: tools/snapshots
      - uses: actions/download-artifact@v8
        continue-on-error: true   # no artifact: no new or changed picture
        with:
          name: snapshots
          path: ${{ runner.temp }}/snapshots
      - name: Publish
        run: tools/snapshots/publish.sh "$RUNNER_TEMP/snapshots" "${{ github.event.pull_request.number }}"
        env:
          GH_TOKEN: ${{ github.token }}

  desktop-extension:
    name: Claude desktop extension (Node tests, pack)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: node --test (the runner's Node; Claude desktop brings its own)
        run: node --version && node --test DesktopExtension/test/server.test.js
      - name: Pack macEM.mcpb and mac4DSTEM.mcpb
        run: DesktopExtension/pack.sh "$RUNNER_TEMP/mcpb"
      - uses: actions/upload-artifact@v7
        with:
          name: claude-desktop-extensions
          path: ${{ runner.temp }}/mcpb/*.mcpb

  version:
    name: CHANGELOG version matches the tag
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v7
      - name: Compare
        run: |
          top=$(grep -m1 -E '^## \[?v?[0-9]+\.[0-9]+\.[0-9]+' CHANGELOG.md | sed -E 's/^## \[?v?([0-9]+\.[0-9]+\.[0-9]+).*/\1/')
          tag=${GITHUB_REF_NAME#v}
          [ "$top" = "$tag" ] || { echo "CHANGELOG top is $top, tag is $tag"; exit 1; }

  private-refs:
    name: No private references
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Scan tracked files
        run: |
          if git grep -n -I -E '_archive|CLAUDE\.md|memcap|macEM-suite|setup-python-refs' -- ':!.gitignore' ':!.github/workflows/ci.yml'; then
            echo "Private references above; this repo is public."; exit 1
          fi

  lint:
    name: Lint (shared SwiftLint and SwiftFormat config)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: SwiftLint
        run: docker run --rm -v "$PWD:/work" -w /work --entrypoint swiftlint ghcr.io/realm/swiftlint:0.65.1 lint --strict --quiet
      - name: SwiftFormat
        run: docker run --rm -v "$PWD:/work" -w /work --entrypoint swiftformat ghcr.io/nicklockwood/swiftformat:0.64.4 --lint .
